name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout JUCE 8.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Configure (MSVC, x64)
        run: >
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
          -DJUCE_PATH=${{ github.workspace }}/JUCE

      - name: Build VST3 + Standalone + DSP test (Release)
        run: >
          cmake --build plugin/build --config Release
          --target SpectralHold_VST3 SpectralHold_Standalone SpectralHoldTest

      - name: Run DSP smoke-test
        run: plugin/build/SpectralHoldTest_artefacts/Release/SpectralHoldTest.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpectralHold-VST3-Windows
          path: plugin/build/SpectralHold_artefacts/Release/VST3/Spectral Hold.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SpectralHold-Standalone-Windows
          path: plugin/build/SpectralHold_artefacts/Release/Standalone/Spectral Hold.exe
