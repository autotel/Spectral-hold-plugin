name: Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux }
          - { os: macos-latest,   name: macOS }
          - { os: windows-2022,   name: Windows }

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout JUCE 8.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          -DJUCE_PATH=${{ github.workspace }}/JUCE

      - name: Build VST3 + Standalone + DSP test
        run: >
          cmake --build plugin/build --config Release --parallel
          --target SpectralHold_VST3 SpectralHold_Standalone SpectralHoldTest

      - name: Run DSP smoke-test (Unix)
        if: runner.os != 'Windows'
        run: plugin/build/SpectralHoldTest_artefacts/Release/SpectralHoldTest

      - name: Run DSP smoke-test (Windows)
        if: runner.os == 'Windows'
        run: plugin/build/SpectralHoldTest_artefacts/Release/SpectralHoldTest.exe

      # CLAP (agent-wiki/plan-roadmap.md B10): Linux-only in CI -- it's a separate CMake
      # configure with SPECTRALHOLD_CLAP=ON (off above so the main configure/build stays
      # offline-fast, see build.sh), fetching clap-juce-extensions over the network.
      # Build-only here (no Linux CLAP host in the runner to load it into).
      - name: Configure CLAP (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S plugin -B plugin/build-clap -DCMAKE_BUILD_TYPE=Release
          -DJUCE_PATH=${{ github.workspace }}/JUCE -DSPECTRALHOLD_CLAP=ON

      - name: Build CLAP (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake --build plugin/build-clap --config Release --parallel
          --target SpectralHold_CLAP

      # Stage everything under a properly-named "autotel-spectral-hold" folder before
      # upload -- pointing upload-artifact straight at a .vst3 bundle zips its *contents*
      # (a bare "Contents/" dir at the zip root, no indication what plugin it even is).
      # Point path at the STAGING dir's parent (dist/) so the zip preserves the
      # "autotel-spectral-hold/" wrapper folder as its top-level entry.
      - name: Stage release bundle
        shell: bash
        run: |
          mkdir -p dist/autotel-spectral-hold
          cp -R "plugin/build/SpectralHold_artefacts/Release/VST3/Spectral Hold.vst3" dist/autotel-spectral-hold/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp "plugin/build/SpectralHold_artefacts/Release/Standalone/Spectral Hold" dist/autotel-spectral-hold/
            cp "plugin/build-clap/SpectralHold_artefacts/Release/CLAP/Spectral Hold.clap" dist/autotel-spectral-hold/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "plugin/build/SpectralHold_artefacts/Release/Standalone/Spectral Hold.app" dist/autotel-spectral-hold/
          else
            cp "plugin/build/SpectralHold_artefacts/Release/Standalone/Spectral Hold.exe" dist/autotel-spectral-hold/
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: autotel-spectral-hold-${{ matrix.name }}
          path: dist

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform bundle
        run: |
          cd artifacts
          for d in autotel-spectral-hold-*; do
            ( cd "$d" && zip -rq "../${d}.zip" autotel-spectral-hold )
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
